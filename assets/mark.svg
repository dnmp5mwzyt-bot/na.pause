<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" role="img" aria-label="Monté Coffee House">
  <!-- Знак Monté: гора внутри кофейной чашки.
       Поверхность кофе и гребень горы вырезаны маской, поэтому сквозь них
       видно фон — знак работает и на светлом, и на тёмном. -->
  <defs>
    <mask id="cut" maskUnits="userSpaceOnUse" x="0" y="0" width="100" height="100">
      <rect width="100" height="100" fill="#fff"/>
      <!-- поверхность кофе под краем чашки -->
      <path d="M28.5 50.5 C36 54.2 64 54.2 71.5 50.5"
            fill="none" stroke="#000" stroke-width="2.3" stroke-linecap="round"/>
      <!-- гребень: одна доминирующая вершина, плечо слева и склон справа -->
      <path d="M26 68 L34.5 59 L39 63.5 L49 49.5 L56.5 59.5 L61 55.5 L67.5 63 L74 68"
            fill="none" stroke="#000" stroke-width="2.8" stroke-linejoin="round" stroke-linecap="round"/>
      <!-- снежная шапка: зигзаг под самой вершиной -->
      <path d="M44.6 55.4 L47 58 L49.2 54.4 L51.6 58 L54 55.2"
            fill="none" stroke="#000" stroke-width="1.7" stroke-linejoin="round" stroke-linecap="round"/>
    </mask>
  </defs>

  <g fill="#3e2b1e" stroke="#3e2b1e" stroke-linecap="round">
    <!-- пар -->
    <path d="M50 38 C50 32 57.5 30 57.5 23 C57.5 16 49.5 14.5 49.5 7.5" fill="none" stroke-width="4.4"/>
    <!-- ручка -->
    <path d="M74.5 49.5 C84.5 49.5 89 54 89 58.5 C89 63.5 84 67.5 76 67.5" fill="none" stroke-width="4.2"/>
    <!-- чашка: край и корпус, вырезы задаёт маска -->
    <g mask="url(#cut)" stroke="none">
      <ellipse cx="50" cy="44" rx="24" ry="4"/>
      <path d="M26 44 H74 V54 C74 65 63 72.5 50 72.5 C37 72.5 26 65 26 54 Z"/>
    </g>
    <!-- блюдце -->
    <path d="M21 78.5 C32 85.5 68 85.5 79 78.5" fill="none" stroke-width="3.2"/>
  </g>
</svg>
